<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      Live Chat
    </div>
    <div class="card-body">
      <!-- Messages display -->
      <div class="messages-container mb-3" style="height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
        <ul class="list-unstyled">
          <li *ngFor="let message of messages" class="mb-2 p-2 bg-light rounded">
            {{ message }}
          </li>
        </ul>
      </div>

      <!-- Message input form -->
      <form (ngSubmit)="sendMessage()">
        <div class="input-group">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Type your message..." 
            [(ngModel)]="newMessage"
            name="newMessage"
            (keyup.enter)="sendMessage()"
          >
          <button class="btn btn-primary" type="submit">Send</button>
        </div>
      </form>
    </div>
  </div>
</div>
